name: babycare_notes
description: BabyCare Notes - Every Precious Moment Matters. Track baby development and daily activities.

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.3 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.6
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.3
  uuid: ^4.1.0
  in_app_purchase: ^3.2.1
  http: ^1.2.2
  intl: ^0.20.2
  fl_chart: ^0.70.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  share_plus: ^10.1.4
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon_foreground.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon_foreground.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon_foreground.png
